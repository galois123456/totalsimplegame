<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 기초 연산 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- MathJax 렌더링 설정 및 CDN 추가 -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            startup: { typeset: false } // 수동 렌더링을 위해 초기 렌더링 끔
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            /* 귀여운 파스텔톤 배경 */
            background-color: #ffecd2;
            background-image: linear-gradient(120deg, #fccb90 0%, #d57eeb 100%);
            min-height: 100vh;
        }

        /* 통통 튀는 애니메이션 (정답) */
        @keyframes bounce-in {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 흔들리는 애니메이션 (오답) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .animate-bounce-in {
            animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .animate-shake {
            animation: shake 0.5s ease-in-out forwards;
        }

        /* 라디오 버튼 숨기고 라벨 디자인 변경 */
        input[type="radio"] {
            display: none;
        }
        input[type="radio"]:checked + label {
            background-color: #ff6b6b;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }
        
        /* 입력창 포커스 아웃라인 커스텀 */
        input:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.3);
        }

        /* 수식이 들어갈 영역의 폰트 조정 */
        #question-display {
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-sm p-6 sm:p-10 rounded-3xl shadow-2xl w-full max-w-lg text-center border-4 border-white">
        
        <!-- 헤더 영역 -->
        <h1 class="text-4xl sm:text-5xl text-pink-500 mb-2 drop-shadow-sm">재미있는 수학 퀴즈 ✏️</h1>
        <p class="text-gray-500 mb-6 text-lg">어떤 문제를 풀어볼까요?</p>

        <!-- 카테고리 선택 영역 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <div>
                <input type="radio" id="type-add" name="quiz-type" value="add">
                <label for="type-add" class="cursor-pointer inline-block bg-pink-100 text-pink-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-pink-200">➕ 덧셈</label>
            </div>
            <div>
                <input type="radio" id="type-sub" name="quiz-type" value="sub">
                <label for="type-sub" class="cursor-pointer inline-block bg-blue-100 text-blue-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-blue-200">➖ 뺄셈</label>
            </div>
            <div>
                <input type="radio" id="type-mul" name="quiz-type" value="mul">
                <label for="type-mul" class="cursor-pointer inline-block bg-green-100 text-green-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-green-200">✖️ 곱셈</label>
            </div>
            <div>
                <input type="radio" id="type-div" name="quiz-type" value="div">
                <label for="type-div" class="cursor-pointer inline-block bg-yellow-100 text-yellow-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-yellow-200">➗ 나눗셈</label>
            </div>
            <div>
                <input type="radio" id="type-frac" name="quiz-type" value="frac">
                <label for="type-frac" class="cursor-pointer inline-block bg-orange-100 text-orange-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-orange-200">🍕 분수</label>
            </div>
            <div>
                <input type="radio" id="type-dec" name="quiz-type" value="dec">
                <label for="type-dec" class="cursor-pointer inline-block bg-teal-100 text-teal-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-teal-200">💧 소수</label>
            </div>
            <div>
                <input type="radio" id="type-mix" name="quiz-type" value="mix" checked>
                <label for="type-mix" class="cursor-pointer inline-block bg-purple-100 text-purple-700 rounded-full px-4 py-2 text-xl transition-all hover:bg-purple-200">🎲 모두 다!</label>
            </div>
        </div>

        <!-- 점수 표시 영역 -->
        <div class="bg-yellow-300 inline-block px-6 py-2 rounded-2xl mb-8 transform rotate-2 shadow-sm">
            <span class="text-2xl text-yellow-900">내 점수: <span id="score" class="text-3xl text-red-500">0</span> 🌟</span>
        </div>

        <!-- 문제 및 입력 영역 -->
        <div class="bg-gray-50 rounded-2xl p-6 sm:p-8 mb-6 border-2 border-gray-200 shadow-inner">
            <!-- 수식이 들어갈 박스 (최소 높이 지정하여 레이아웃 덜컹거림 방지) -->
            <div id="question-display" class="text-5xl sm:text-6xl text-gray-800 mb-6 font-bold min-h-[80px] flex items-center justify-center">
                <!-- 문제가 여기에 표시됩니다 -->
            </div>
            
            <div class="flex items-center justify-center gap-3 sm:gap-4 flex-col sm:flex-row">
                <input type="text" id="answer-input" class="w-48 text-center text-4xl py-3 rounded-xl border-4 border-blue-300 text-blue-600 transition-all" placeholder="정답 입력" autocomplete="off">
                <button id="submit-btn" class="bg-blue-500 hover:bg-blue-600 text-white text-3xl py-3 px-6 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                    확인!
                </button>
            </div>
            <p class="text-gray-400 mt-4 text-sm font-medium">💡 분수는 <b>2/5</b>, 소수는 <b>1.2</b> 처럼 적어주세요!</p>
        </div>

        <!-- 피드백 메시지 -->
        <div id="feedback-message" class="text-2xl sm:text-3xl h-10 opacity-0 transition-opacity duration-300">
            <!-- 정답/오답 메시지가 여기에 표시됩니다 -->
        </div>

    </div>

    <script>
        // 상태 변수 초기화
        let currentAnswer = "";
        let score = 0;
        let isWaitingForNext = false;

        // DOM 요소 참조
        const questionDisplay = document.getElementById('question-display');
        const answerInput = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const scoreDisplay = document.getElementById('score');
        const feedbackMessage = document.getElementById('feedback-message');
        const typeRadios = document.querySelectorAll('input[name="quiz-type"]');

        /**
         * MathJax 비동기 렌더링 함수
         * 모듈이 로드되기 전에 호출되어 발생하는 백화현상(ReferenceError)을 방지합니다.
         */
        function safeRenderMath() {
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionDisplay]).catch(function (err) {
                    console.log('MathJax 렌더링 에러:', err.message);
                });
            } else {
                // MathJax가 아직 로드되지 않았다면 50ms 후 재시도
                setTimeout(safeRenderMath, 50);
            }
        }

        function generateProblem() {
            // 새 문제를 낼 때는 입력창 비우고 포커스 주기
            answerInput.value = '';
            answerInput.focus();
            feedbackMessage.style.opacity = '0';
            feedbackMessage.className = 'text-2xl sm:text-3xl h-10 opacity-0 transition-opacity duration-300';
            isWaitingForNext = false;

            // 선택된 문제 유형 가져오기
            const selectedType = document.querySelector('input[name="quiz-type"]:checked').value;
            let typeToGenerate = selectedType;

            // '모두 다' 선택 시 무작위로 하나 고르기
            if (typeToGenerate === 'mix') {
                const types = ['add', 'sub', 'mul', 'div', 'frac', 'dec'];
                typeToGenerate = types[Math.floor(Math.random() * types.length)];
            }

            let num1, num2, symbol;
            let displayString = "";

            // 난이도 및 조건에 따른 문제 생성
            switch (typeToGenerate) {
                case 'add':
                    // 1자리 ~ 2자리 (합이 최대 100을 넘지 않도록)
                    num1 = Math.floor(Math.random() * 49) + 1; // 1~49
                    num2 = Math.floor(Math.random() * 49) + 1; // 1~49
                    currentAnswer = (num1 + num2).toString();
                    displayString = `\\( ${num1} + ${num2} \\)`;
                    break;
                case 'sub':
                    // 큰 수에서 작은 수를 빼도록 보장 (음수 방지)
                    num1 = Math.floor(Math.random() * 89) + 10; // 10~98
                    num2 = Math.floor(Math.random() * num1); // num1 보다 작은 수
                    currentAnswer = (num1 - num2).toString();
                    displayString = `\\( ${num1} - ${num2} \\)`;
                    break;
                case 'mul':
                    // 구구단 수준 (2~9단)
                    num1 = Math.floor(Math.random() * 8) + 2; // 2~9
                    num2 = Math.floor(Math.random() * 9) + 1; // 1~9
                    currentAnswer = (num1 * num2).toString();
                    displayString = `\\( ${num1} \\times ${num2} \\)`;
                    break;
                case 'div':
                    // 나누어 떨어지도록 역산으로 생성 (A ÷ B = C -> B × C = A)
                    let b = Math.floor(Math.random() * 8) + 2; // 2~9 (나누는 수)
                    let c = Math.floor(Math.random() * 9) + 1; // 1~9 (몫)
                    num1 = b * c; // 나누어지는 수
                    num2 = b;
                    currentAnswer = c.toString();
                    displayString = `\\( ${num1} \\div ${num2} \\)`;
                    break;
                case 'frac':
                    // 분모가 같은 진분수의 덧셈과 뺄셈
                    let denom = Math.floor(Math.random() * 7) + 3; // 분모 3~9
                    let n1 = Math.floor(Math.random() * (denom - 1)) + 1; // 분자1 (1 ~ 분모-1)
                    let n2 = Math.floor(Math.random() * (denom - 1)) + 1; // 분자2 (1 ~ 분모-1)
                    let isAdd = Math.random() > 0.5;
                    
                    if (isAdd) {
                        // 덧셈: 두 분자의 합이 분모보다 작게 하여 진분수 유지
                        if (n1 + n2 >= denom) {
                            n1 = Math.floor(n1 / 2) || 1;
                            n2 = Math.floor(n2 / 2) || 1;
                        }
                        currentAnswer = `${n1 + n2}/${denom}`;
                        displayString = `\\( \\frac{${n1}}{${denom}} + \\frac{${n2}}{${denom}} \\)`;
                    } else {
                        // 뺄셈: 음수가 나오지 않도록 큰 수에서 작은 수를 뺌
                        if (n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
                        if (n1 === n2) { n1 = Math.min(n1 + 1, denom - 1); } // 답이 0이 되는 것 방지
                        currentAnswer = `${n1 - n2}/${denom}`;
                        displayString = `\\( \\frac{${n1}}{${denom}} - \\frac{${n2}}{${denom}} \\)`;
                    }
                    break;
                case 'dec':
                    // 소수 첫째 자리 수의 덧셈과 뺄셈
                    let d1 = Math.floor(Math.random() * 89) + 10; // 1.0 ~ 9.8 
                    let d2 = Math.floor(Math.random() * 89) + 10;
                    let isDecAdd = Math.random() > 0.5;
                    
                    if (isDecAdd) {
                        currentAnswer = ((d1 + d2) / 10).toString();
                        displayString = `\\( ${d1/10} + ${d2/10} \\)`;
                    } else {
                        if (d1 < d2) { let temp = d1; d1 = d2; d2 = temp; }
                        currentAnswer = ((d1 - d2) / 10).toString();
                        displayString = `\\( ${d1/10} - ${d2/10} \\)`;
                    }
                    break;
            }
            
            // 문제 문자열 적용 및 안전한 MathJax 렌더링 호출
            questionDisplay.innerHTML = displayString;
            safeRenderMath();
        }

        function checkAnswer() {
            if (isWaitingForNext) return;

            const userAnswer = answerInput.value.trim().replace(/\s/g, ''); // 공백 제거
            
            // 입력값이 비어있는지 확인
            if (userAnswer === '') {
                showFeedback('답을 적어주세요! 🤔', 'text-gray-500');
                return;
            }

            isWaitingForNext = true;
            let isCorrect = false;
            
            // 1. 문자열이 완벽하게 일치하는 경우 (예: 분수 '3/5')
            if (userAnswer === currentAnswer) {
                isCorrect = true;
            } 
            // 2. 숫자로 변환 가능하고 값이 같은 경우 (예: 소수 '1.0' === '1')
            else if (!isNaN(userAnswer) && !isNaN(currentAnswer) && Number(userAnswer) === Number(currentAnswer)) {
                isCorrect = true;
            }

            if (isCorrect) {
                // 정답 처리
                score += 10;
                scoreDisplay.textContent = score;
                showFeedback('정답입니다! 최고예요! 🎉', 'text-green-500', 'animate-bounce-in');
                
                // 1.5초 후 새 문제 출제
                setTimeout(generateProblem, 1500);
            } else {
                // 오답 처리
                showFeedback('아쉽네요! 다시 생각해볼까요? 😥', 'text-red-500', 'animate-shake');
                
                // 점수 삭감 없이 다시 풀 기회 제공
                setTimeout(() => {
                    isWaitingForNext = false;
                    answerInput.value = '';
                    answerInput.focus();
                    feedbackMessage.style.opacity = '0';
                    feedbackMessage.classList.remove('animate-shake');
                }, 1500);
            }
        }

        function showFeedback(text, colorClass, animationClass = '') {
            feedbackMessage.textContent = text;
            feedbackMessage.className = `text-2xl sm:text-3xl h-10 transition-opacity duration-300 opacity-100 ${colorClass} ${animationClass}`;
        }

        submitBtn.addEventListener('click', checkAnswer);

        // 엔터키로 정답 제출
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // 라디오 버튼을 바꾸면 즉시 새로운 문제를 출제
        typeRadios.forEach(radio => {
            radio.addEventListener('change', generateProblem);
        });

        // 앱이 처음 로드될 때 첫 문제 출제 (렌더링은 내부의 안전망이 처리함)
        window.onload = function() {
            generateProblem();
        };
    </script>
</body>
</html>
