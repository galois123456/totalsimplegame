<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>분수 계산 탐험대</title>
  <style>
    :root{
      --bg1:#eef7ff;
      --bg2:#fff7e8;
      --card:#ffffff;
      --ink:#24324a;
      --muted:#68758a;
      --primary:#4f7cff;
      --primary-dark:#3158c8;
      --good:#1fa971;
      --bad:#e45757;
      --yellow:#ffca55;
      --line:#dfe7f3;
      --shadow:0 14px 35px rgba(54,78,120,.15);
    }
    *{box-sizing:border-box}

    [hidden]{
      display:none !important;
    }
    body{
      margin:0;
      min-height:100vh;
      font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(79,124,255,.18), transparent 26%),
        radial-gradient(circle at 88% 88%, rgba(255,202,85,.22), transparent 28%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      justify-content:center;
      align-items:center;
      padding:22px;
    }
    button,input,select{font:inherit}
    .app{
      width:min(1050px,100%);
      display:grid;
      grid-template-columns:320px 1fr;
      gap:20px;
    }
    .panel,.game{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.9);
      border-radius:28px;
      box-shadow:var(--shadow);
    }
    .panel{padding:24px}
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }
    .logo{
      width:56px;height:56px;
      display:grid;place-items:center;
      border-radius:18px;
      background:linear-gradient(135deg,#5b8cff,#7b68ee);
      color:#fff;
      font-size:30px;
      box-shadow:0 8px 18px rgba(79,124,255,.28);
    }
    h1{font-size:24px;margin:0}
    .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
    .section{margin-top:20px}
    .section-title{
      font-size:14px;
      font-weight:800;
      margin-bottom:9px;
    }
    .segmented{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }
    .segmented.three{grid-template-columns:repeat(3,1fr)}
    .choice{
      border:1px solid var(--line);
      background:#f8fbff;
      color:var(--ink);
      border-radius:12px;
      padding:10px 7px;
      cursor:pointer;
      font-weight:750;
      transition:.15s;
    }
    .choice:hover{transform:translateY(-1px);border-color:#9eb5f5}
    .choice.active{
      color:#fff;
      background:var(--primary);
      border-color:var(--primary);
      box-shadow:0 6px 14px rgba(79,124,255,.25);
    }
    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 2px;
      color:var(--muted);
      font-size:14px;
    }
    .switch{
      position:relative;width:48px;height:27px;flex:0 0 auto;
    }
    .switch input{display:none}
    .slider{
      position:absolute;inset:0;
      background:#cbd5e4;border-radius:999px;cursor:pointer;
      transition:.2s;
    }
    .slider:before{
      content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;
      background:white;border-radius:50%;transition:.2s;
      box-shadow:0 2px 6px rgba(0,0,0,.2);
    }
    .switch input:checked + .slider{background:var(--primary)}
    .switch input:checked + .slider:before{transform:translateX(21px)}
    .stats-mini{
      display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;
    }
    .stat-box{
      padding:11px 5px;text-align:center;border-radius:14px;background:#f5f8fd;
      border:1px solid var(--line);
    }
    .stat-box strong{display:block;font-size:20px}
    .stat-box span{font-size:11px;color:var(--muted)}
    .reset{
      width:100%;margin-top:18px;border:0;border-radius:13px;
      padding:11px;background:#eef2f8;color:#59677a;font-weight:800;cursor:pointer;
    }
    .game{
      min-height:650px;
      padding:26px 30px;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .badge{
      display:inline-flex;align-items:center;gap:7px;
      padding:8px 13px;border-radius:999px;
      background:#edf2ff;color:var(--primary-dark);font-weight:850;font-size:14px;
    }
    .progress-wrap{flex:1;max-width:320px}
    .progress-label{
      display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
      margin-bottom:6px;
    }
    .progress{
      height:10px;background:#edf1f7;border-radius:999px;overflow:hidden;
    }
    .progress > div{
      height:100%;width:0;background:linear-gradient(90deg,#4f7cff,#7e6cf2);
      transition:width .25s;
    }
    .question-area{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px 0 15px;
    }
    .prompt{
      color:var(--muted);font-weight:700;margin-bottom:18px;text-align:center;
    }
    .expression{
      display:flex;align-items:center;justify-content:center;
      gap:8px;font-size:48px;font-weight:900;
      min-height:130px;
    }
    .fraction{
      display:inline-grid;
      grid-template-rows:1fr 3px 1fr;
      align-items:center;
      justify-items:center;
      min-width:82px;
      line-height:1;
    }
    .fraction .bar{width:100%;height:3px;background:var(--ink);border-radius:3px}
    .term-slot{
      width:132px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 132px;
    }
    .signed-fraction{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:4px;
    }
    .problem-sign{
      min-width:18px;
      text-align:center;
      font-size:.76em;
      font-weight:900;
      color:var(--ink);
    }
    .paren{
      width:13px;
      text-align:center;
      font-size:1.18em;
      font-weight:500;
      color:var(--ink);
    }
    .operator{
      width:48px;
      flex:0 0 48px;
      text-align:center;
      font-size:44px;
    }
    .equals{font-size:42px}
    .answer-fraction{
      display:inline-grid;
      grid-template-rows:52px 4px 52px;
      align-items:center;
      justify-items:center;
      width:110px;
      min-width:110px;
      vertical-align:middle;
    }
    .answer-fraction input{
      width:100%;
      height:46px;
      text-align:center;
      font-size:23px;
      font-weight:850;
      border:2px solid var(--line);
      border-radius:12px;
      outline:none;
      background:#fbfdff;
      color:var(--ink);
    }
    .answer-fraction input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(79,124,255,.12);
    }
    .answer-line{
      width:100%;
      height:4px;
      background:var(--ink);
      border-radius:4px;
    }
    .inline-answer{transform:translateY(2px)}
    .answer-entry-wrap{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-width:148px;
      justify-content:flex-start;
    }
    .sign-toggle{
      width:34px;
      height:42px;
      border:0;
      border-radius:8px;
      font-size:30px;
      line-height:1;
      font-weight:900;
      color:var(--ink);
      background:transparent;
      cursor:pointer;
      box-shadow:none;
      transition:.15s;
      flex:0 0 auto;
      padding:0;
    }
    .sign-toggle:hover{
      background:#eef2f8;
      transform:translateY(-1px);
    }
    .sign-toggle.positive,
    .sign-toggle.negative{
      color:var(--ink);
      background:transparent;
    }
    .sign-toggle.hidden{visibility:hidden}
    .integer-answer{
      display:inline-flex;
      align-items:center;
      width:110px;
    }
    .integer-answer input{
      width:100%;
      height:58px;
      text-align:center;
      font-size:27px;
      font-weight:850;
      border:2px solid var(--line);
      border-radius:14px;
      outline:none;
      background:#fbfdff;
      color:var(--ink);
    }
    .integer-answer input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(79,124,255,.12);
    }
    .integer-answer.correct input{
      border-color:var(--good);
      background:#ecfbf5;
      color:#167d56;
    }
    .integer-answer.incorrect input{
      border-color:var(--bad);
      background:#fff1f1;
      color:#b84343;
    }
    .buttons{
      display:flex;
      justify-content:center;
      margin-top:18px;
    }
    .main-btn,.sub-btn{
      border:0;border-radius:15px;padding:14px 25px;
      font-weight:900;cursor:pointer;transition:.15s;min-width:150px;
    }
    .main-btn{
      color:white;background:linear-gradient(135deg,var(--primary),#6b65e8);
      box-shadow:0 8px 18px rgba(79,124,255,.26);
    }
    .main-btn:hover,.sub-btn:hover{transform:translateY(-2px)}
    .sub-btn{background:#eef2f8;color:#526174}
    .feedback{
      min-height:91px;margin-top:18px;width:min(600px,100%);
      border-radius:18px;padding:15px 18px;text-align:center;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      opacity:0;transform:translateY(5px);transition:.2s;
    }
    .feedback.show{opacity:1;transform:none}
    .feedback.good{background:#eaf9f3;color:#167d56}
    .feedback.bad{background:#fff0f0;color:#b84343}
    .feedback strong{font-size:20px}
    .feedback small{margin-top:5px;line-height:1.5}
    .answer-fraction.correct input{
      border-color:var(--good);
      background:#ecfbf5;
      color:#167d56;
    }
    .answer-fraction.incorrect input{
      border-color:var(--bad);
      background:#fff1f1;
      color:#b84343;
    }
    .tip{
      margin-top:auto;background:#fff8e5;border:1px solid #ffe4a1;
      border-radius:16px;padding:13px 16px;color:#7a5b18;font-size:14px;
    }
    .celebration{font-size:34px;margin-bottom:5px}
    .modal{
      position:fixed;inset:0;background:rgba(22,31,50,.48);
      display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
    }
    .modal.show{display:flex}
    .modal-card{
      width:min(430px,100%);background:white;border-radius:25px;
      padding:28px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.25);
    }
    .modal-card h2{font-size:28px;margin:8px 0}
    .final-score{font-size:54px;font-weight:950;color:var(--primary);margin:12px 0}
    @media(max-width:800px){
      body{padding:10px;align-items:flex-start}
      .app{grid-template-columns:1fr}
      .panel{padding:18px}
      .game{min-height:590px;padding:20px 16px}
      .panel .section-wrap{
        display:grid;grid-template-columns:1fr 1fr;gap:0 16px;
      }
      .stats-mini{margin-top:12px}
      .expression{font-size:34px;gap:5px}
      .term-slot{width:104px;flex-basis:104px}
      .operator{width:38px;flex-basis:38px;font-size:34px}
      .operator,.equals{font-size:34px}
      .fraction{min-width:65px}
    }
    @media(max-width:520px){
      h1{font-size:21px}
      .logo{width:48px;height:48px}
      .panel .section-wrap{grid-template-columns:1fr}
      .topbar{align-items:flex-start}
      .progress-wrap{max-width:185px}
      .expression{font-size:25px;gap:2px;flex-wrap:nowrap}
      .term-slot{width:82px;flex-basis:82px}
      .operator{width:30px;flex-basis:30px;font-size:28px}
      .paren{width:9px}
      .fraction{min-width:55px}
      .answer-entry-wrap{gap:5px;min-width:126px}
      .sign-toggle{width:30px;height:36px;font-size:25px}
      .answer-fraction{width:82px;min-width:82px;grid-template-rows:42px 4px 42px}
      .answer-fraction input{height:37px;font-size:19px}
      .integer-answer{width:82px}
      .integer-answer input{height:48px;font-size:22px}
      .main-btn,.sub-btn{min-width:130px;padding:13px 16px}
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <div class="brand">
        <div class="logo">⅔</div>
        <div>
          <h1>분수 계산 탐험대</h1>
          <div class="subtitle">랜덤 문제를 풀며 분수 실력을 키워요!</div>
        </div>
      </div>

      <div class="section-wrap">
        <section class="section">
          <div class="section-title">계산 종류</div>
          <div class="segmented" id="operationChoices">
            <button class="choice active" data-value="add">덧셈 ＋</button>
            <button class="choice" data-value="sub">뺄셈 －</button>
            <button class="choice" data-value="mul">곱셈 ×</button>
            <button class="choice" data-value="div">나눗셈 ÷</button>
            <button class="choice" data-value="mix" style="grid-column:1 / -1">골고루 출제</button>
          </div>
        </section>

        <section class="section">
          <div class="section-title">난이도</div>
          <div class="segmented three" id="levelChoices">
            <button class="choice active" data-value="easy">쉬움</button>
            <button class="choice" data-value="normal">보통</button>
            <button class="choice" data-value="hard">도전</button>
          </div>
        </section>

        <section class="section">
          <div class="toggle-row">
            <span>정답을 기약분수로 쓰기</span>
            <label class="switch">
              <input type="checkbox" id="requireSimplest" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-row">
            <span>뺄셈 결과를 0 이상으로</span>
            <label class="switch">
              <input type="checkbox" id="positiveOnly" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-row">
            <span>음수 포함 출제</span>
            <label class="switch">
              <input type="checkbox" id="includeNegative">
              <span class="slider"></span>
            </label>
          </div>
        </section>
      </div>

      <div class="stats-mini">
        <div class="stat-box"><strong id="score">0</strong><span>점수</span></div>
        <div class="stat-box"><strong id="streak">0</strong><span>연속 정답</span></div>
        <div class="stat-box"><strong id="accuracy">0%</strong><span>정답률</span></div>
      </div>
      <button class="reset" id="resetBtn">처음부터 다시 하기</button>
    </aside>

    <section class="game">
      <div class="topbar">
        <div class="badge" id="modeBadge">✏️ 덧셈 · 쉬움</div>
        <div class="progress-wrap">
          <div class="progress-label"><span>오늘의 도전</span><span id="progressText">0 / 10</span></div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>
      </div>

      <div class="question-area">
        <div class="prompt">계산한 답을 입력하세요. 음수는 앞의 부호 버튼을 누르세요.</div>

        <div class="expression" aria-label="분수 계산 문제">
          <span class="term-slot">
            <span class="signed-fraction">
              <span id="aOpen" class="paren"></span>
              <span id="aSign" class="problem-sign"></span>
              <span class="fraction">
                <span id="aNum">1</span><span class="bar"></span><span id="aDen">2</span>
              </span>
              <span id="aClose" class="paren"></span>
            </span>
          </span>
          <span class="operator" id="operator">＋</span>
          <span class="term-slot">
            <span class="signed-fraction">
              <span id="bOpen" class="paren"></span>
              <span id="bSign" class="problem-sign"></span>
              <span class="fraction">
                <span id="bNum">1</span><span class="bar"></span><span id="bDen">3</span>
              </span>
              <span id="bClose" class="paren"></span>
            </span>
          </span>
          <span class="equals">＝</span>
          <span class="answer-entry-wrap" aria-label="답 입력">
            <button id="signToggle" class="sign-toggle positive" type="button" aria-label="답의 부호 바꾸기">＋</button>

            <span id="fractionAnswer" class="answer-fraction inline-answer">
              <input id="answerNum" type="number" min="0" inputmode="numeric" placeholder="분자" aria-label="답의 분자">
              <span class="answer-line"></span>
              <input id="answerDen" type="number" min="1" inputmode="numeric" placeholder="분모" aria-label="답의 분모">
            </span>

            <span id="integerAnswer" class="integer-answer" hidden>
              <input id="answerInt" type="number" min="0" inputmode="numeric" placeholder="정수" aria-label="정수 답">
            </span>
          </span>
        </div>

        <div class="buttons">
          <button class="main-btn" id="checkBtn">정답 확인</button>
        </div>

        <div class="feedback" id="feedback"></div>
      </div>

      <div class="tip" id="tip">
        💡 <strong>힌트:</strong> 분모가 다르면 먼저 공통분모를 찾아 보세요.
      </div>
    </section>
  </main>

  <div class="modal" id="resultModal">
    <div class="modal-card">
      <div style="font-size:52px">🏆</div>
      <h2>10문제 완료!</h2>
      <p>끝까지 잘 풀었습니다.</p>
      <div class="final-score" id="finalScore">0점</div>
      <p id="finalMessage"></p>
      <button class="main-btn" id="restartBtn">한 번 더 도전</button>
    </div>
  </div>

<script>
(() => {
  const state = {
    operation: 'add',
    level: 'easy',
    current: null,
    score: 0,
    streak: 0,
    correct: 0,
    attempted: 0,
    completed: 0,
    locked: false,
    sign: 1
  };

  const $ = id => document.getElementById(id);
  const els = {
    aNum:$('aNum'), aDen:$('aDen'), bNum:$('bNum'), bDen:$('bDen'),
    aSign:$('aSign'), bSign:$('bSign'),
    aOpen:$('aOpen'), aClose:$('aClose'), bOpen:$('bOpen'), bClose:$('bClose'),
    operator:$('operator'), answerNum:$('answerNum'), answerDen:$('answerDen'),
    answerInt:$('answerInt'), signToggle:$('signToggle'),
    fractionAnswer:$('fractionAnswer'), integerAnswer:$('integerAnswer'),
    feedback:$('feedback'), score:$('score'), streak:$('streak'),
    accuracy:$('accuracy'), progressText:$('progressText'), progressBar:$('progressBar'),
    modeBadge:$('modeBadge'), tip:$('tip'), resultModal:$('resultModal'),
    finalScore:$('finalScore'), finalMessage:$('finalMessage')
  };

  const operationNames = {add:'덧셈', sub:'뺄셈', mul:'곱셈', div:'나눗셈', mix:'골고루'};
  const levelNames = {easy:'쉬움', normal:'보통', hard:'도전'};
  const symbols = {add:'＋', sub:'－', mul:'×', div:'÷'};

  function gcd(a,b){
    a=Math.abs(a); b=Math.abs(b);
    while(b){ [a,b]=[b,a%b]; }
    return a || 1;
  }

  function simplify(n,d){
    if(d < 0){ n=-n; d=-d; }
    const g=gcd(n,d);
    return {n:n/g,d:d/g};
  }

  function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function choose(arr){ return arr[rand(0,arr.length-1)]; }

  function getRange(){
    if(state.level==='easy') return {den:6, numMode:'proper'};
    if(state.level==='normal') return {den:10, numMode:'proper'};
    return {den:12, numMode:'mixed'};
  }

  function randomFraction(){
    const r=getRange();
    const d=rand(2,r.den);
    let n;
    if(r.numMode==='proper'){
      n=rand(1,d-1);
    }else{
      n=rand(1,d*2-1);
    }

    if($('includeNegative').checked && Math.random()<0.35){
      n *= -1;
    }

    return simplify(n,d);
  }

  function value(f){ return f.n/f.d; }

  function generateQuestion(){
    state.locked=false;
    els.feedback.className='feedback';
    els.feedback.innerHTML='';
    els.fractionAnswer.classList.remove('correct','incorrect');
    els.integerAnswer.classList.remove('correct','incorrect');
    els.answerNum.value='';
    els.answerDen.value='';
    els.answerInt.value='';
    state.sign=1;
    updateSignButton();

    let op=state.operation==='mix' ? choose(['add','sub','mul','div']) : state.operation;
    let a,b,answer,tries=0;

    do{
      a=randomFraction();
      b=randomFraction();
      tries++;

      if(op==='sub' && $('positiveOnly').checked && value(a)<value(b)){
        [a,b]=[b,a];
      }
      if(op==='div' && b.n===0) continue;

      if(op==='add') answer=simplify(a.n*b.d+b.n*a.d,a.d*b.d);
      if(op==='sub') answer=simplify(a.n*b.d-b.n*a.d,a.d*b.d);
      if(op==='mul') answer=simplify(a.n*b.n,a.d*b.d);
      if(op==='div') answer=simplify(a.n*b.d,a.d*b.n);

    }while((answer.d>50 || Math.abs(answer.n)>80) && tries<100);

    state.current={a,b,op,answer};

    const isIntegerAnswer = answer.d === 1;
    els.fractionAnswer.hidden = isIntegerAnswer;
    els.integerAnswer.hidden = !isIntegerAnswer;

    if(isIntegerAnswer){
      els.fractionAnswer.style.display='none';
      els.integerAnswer.style.display='inline-flex';
    }else{
      els.fractionAnswer.style.display='inline-grid';
      els.integerAnswer.style.display='none';
    }

    els.signToggle.classList.toggle('hidden', answer.n === 0);

    const aNegative=a.n<0;
    const bNegative=b.n<0;

    els.aOpen.textContent=aNegative?'(':'';
    els.aClose.textContent=aNegative?')':'';
    els.bOpen.textContent=bNegative?'(':'';
    els.bClose.textContent=bNegative?')':'';
    els.aSign.textContent=aNegative?'−':'';
    els.bSign.textContent=bNegative?'−':'';

    els.aNum.textContent=Math.abs(a.n); els.aDen.textContent=a.d;
    els.bNum.textContent=Math.abs(b.n); els.bDen.textContent=b.d;
    els.operator.textContent=symbols[op];
    updateBadge(op);
    updateTip(op);
    setTimeout(()=>{
      if(state.current.answer.d===1) els.answerInt.focus();
      else els.answerNum.focus();
    },80);
  }

  function updateBadge(actualOp){
    const opLabel = state.operation==='mix' ? `${operationNames[actualOp]} 출제` : operationNames[state.operation];
    els.modeBadge.textContent=`✏️ ${opLabel} · ${levelNames[state.level]}`;
  }

  function updateTip(op){
    const tips={
      add:'분모가 다르면 공통분모를 만든 뒤 분자끼리 더해요.',
      sub:'분모가 다르면 공통분모를 만든 뒤 분자끼리 빼요.',
      mul:'분자는 분자끼리, 분모는 분모끼리 곱해요.',
      div:'나누는 분수의 분자와 분모를 뒤집고 곱해요.'
    };
    const negativeTip=$('includeNegative').checked?' 음수의 부호도 함께 확인하세요.':'';
    els.tip.innerHTML=`💡 <strong>힌트:</strong> ${tips[op]}${negativeTip}`;
  }

  function displayFraction(f){
    return f.d===1 ? `${f.n}` : `${f.n}/${f.d}`;
  }

  function explanation(){
    const {a,b,op,answer}=state.current;
    if(op==='add'){
      return `${a.n}×${b.d} + ${b.n}×${a.d} = ${a.n*b.d+b.n*a.d}, 분모는 ${a.d*b.d} → ${displayFraction(answer)}`;
    }
    if(op==='sub'){
      return `${a.n}×${b.d} - ${b.n}×${a.d} = ${a.n*b.d-b.n*a.d}, 분모는 ${a.d*b.d} → ${displayFraction(answer)}`;
    }
    if(op==='mul'){
      return `${a.n}×${b.n} / ${a.d}×${b.d} = ${a.n*b.n}/${a.d*b.d} → ${displayFraction(answer)}`;
    }
    return `${displayFraction(a)} × ${b.d}/${b.n} = ${a.n*b.d}/${a.d*b.n} → ${displayFraction(answer)}`;
  }

  function updateSignButton(){
    const negative = state.sign === -1;
    els.signToggle.textContent = negative ? '−' : '＋';
    els.signToggle.classList.toggle('negative', negative);
    els.signToggle.classList.toggle('positive', !negative);
    els.signToggle.setAttribute('aria-label', negative ? '현재 음수, 눌러서 양수로 바꾸기' : '현재 양수, 눌러서 음수로 바꾸기');
  }

  function checkAnswer(){
    if(state.locked){ nextQuestion(); return; }

    const target=state.current.answer;
    const isIntegerMode = target.d === 1;

    let raw;
    if(isIntegerMode){
      const intValue=Number(els.answerInt.value);
      if(!Number.isInteger(intValue)){
        showFeedback(false,'정수 답을 입력하세요.','');
        return;
      }
      raw={n:state.sign*Math.abs(intValue),d:1};
    }else{
      const n=Number(els.answerNum.value);
      const d=Number(els.answerDen.value);

      if(!Number.isInteger(n) || !Number.isInteger(d) || d===0){
        showFeedback(false,'분자와 0이 아닌 분모를 모두 입력하세요.','');
        return;
      }
      raw={n:state.sign*Math.abs(n),d:Math.abs(d)};
    }

    const user=simplify(raw.n,raw.d);
    const equivalent=user.n===target.n && user.d===target.d;
    const isSimplest=gcd(raw.n,raw.d)===1;
    const correct=equivalent && (!$('requireSimplest').checked || isSimplest);

    state.attempted++;
    state.completed++;

    const answerTarget = isIntegerMode ? els.integerAnswer : els.fractionAnswer;
    answerTarget.classList.add(correct?'correct':'incorrect');

    if(correct){
      state.correct++;
      state.streak++;
      const bonus=Math.min(state.streak-1,5)*2;
      const points=10+bonus;
      state.score+=points;
      showFeedback(true,`정답입니다! +${points}점`,`정답: ${displayFraction(target)}`);
    }else{
      state.streak=0;
      let title='아쉬워요. 다시 확인해 봅시다.';
      if(equivalent && !isSimplest) title='값은 맞지만 기약분수로 더 줄일 수 있어요.';
      showFeedback(false,title,`정답: ${displayFraction(target)} · ${explanation()}`);
    }

    state.locked=true;
    $('checkBtn').textContent=state.completed>=10?'결과 보기':'다음 문제';
    updateStats();
  }

  function showFeedback(good,title,detail){
    els.feedback.className=`feedback show ${good?'good':'bad'}`;
    els.feedback.innerHTML=`<div class="celebration">${good?'🌟':'🧩'}</div><strong>${title}</strong><small>${detail}</small>`;
  }

  function nextQuestion(){
    if(state.completed>=10){
      showResult();
      return;
    }
    $('checkBtn').textContent='정답 확인';
    generateQuestion();
  }

  function updateStats(){
    els.score.textContent=state.score;
    els.streak.textContent=state.streak;
    const acc=state.attempted ? Math.round(state.correct/state.attempted*100) : 0;
    els.accuracy.textContent=`${acc}%`;
    els.progressText.textContent=`${state.completed} / 10`;
    els.progressBar.style.width=`${state.completed*10}%`;
  }

  function showResult(){
    const acc=state.attempted ? Math.round(state.correct/state.attempted*100) : 0;
    els.finalScore.textContent=`${state.score}점`;
    let msg = acc===100 ? '완벽합니다! 분수 계산 달인입니다.' :
              acc>=80 ? '매우 잘했습니다. 한 번 더 하면 더 빨라질 거예요.' :
              acc>=60 ? '좋은 출발입니다. 틀린 유형을 다시 연습해 보세요.' :
                        '천천히 계산 과정을 적으면서 다시 도전해 보세요.';
    els.finalMessage.textContent=`정답률 ${acc}% · ${msg}`;
    els.resultModal.classList.add('show');
  }

  function resetGame(){
    Object.assign(state,{score:0,streak:0,correct:0,attempted:0,completed:0,locked:false,sign:1});
    $('checkBtn').textContent='정답 확인';
    els.resultModal.classList.remove('show');
    updateStats();
    generateQuestion();
  }

  function bindChoices(containerId,key){
    $(containerId).addEventListener('click',e=>{
      const btn=e.target.closest('.choice');
      if(!btn) return;
      [...$(containerId).querySelectorAll('.choice')].forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      state[key]=btn.dataset.value;
      resetGame();
    });
  }

  bindChoices('operationChoices','operation');
  bindChoices('levelChoices','level');

  $('checkBtn').addEventListener('click',checkAnswer);  $('resetBtn').addEventListener('click',resetGame);
  $('restartBtn').addEventListener('click',resetGame);
  els.signToggle.addEventListener('click',()=>{
    if(state.locked) return;
    state.sign *= -1;
    updateSignButton();
  });
  $('requireSimplest').addEventListener('change',resetGame);
  $('positiveOnly').addEventListener('change',resetGame);
  $('includeNegative').addEventListener('change',resetGame);

  [els.answerNum,els.answerDen,els.answerInt].forEach(input=>{
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter') checkAnswer();
    });
  });

  generateQuestion();
  updateStats();
})();
</script>
</body>
</html>
